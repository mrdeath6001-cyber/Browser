name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip browser.zip -d proj
      - run: cd proj && gradle assembleDebug --no-daemon
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v${{ github.run_number }} proj/app/build/outputs/apk/debug/app-debug.apk --title "Браузер v${{ github.run_number }}" --notes "Debug APK"
